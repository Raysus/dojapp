# Solo base de datos. Backend y frontend se ejecutan en local (npm run dev).
services:
  postgres:
    image: postgres:16-alpine
    container_name: dojapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dojapp
    ports:
      - "5432:5432"
    volumes:
      - dojapp_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dojapp"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  dojapp_pg_data:
